<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Center Notepad Pro</title>
    <script>
      // Redirect any 404 subpath under /Agent-Notepad/ back to the root of /Agent-Notepad/
      var path = window.location.pathname;
      var repoMatch = path.match(/^(\/[^/]+\/)/);
      if (repoMatch) {
        window.location.replace(repoMatch[1]);
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    Redirecting to Call Center Notepad Pro...
  </body>
</html>
